<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store | Premium Vehicles</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<header>
    <nav class="main-nav"> 
        <ul>
            <li><img src="imeages/ilogo.png" alt="Logo" class="logo"></li>
            <li><a href="#Home">Home</a></li>
            <li><a href="#About">About</a></li>
            <li><a href="#catalog">Products</a></li>
            <li><a href="#review-cards">Reviews</a></li>
            <li><a href="#footer">Contact</a></li> 
        </ul>
    </nav>
</header>

<div class="hero-image" id="Home">
    <div class="hero-text" style="opacity: 0; transform: translateY(20px); transition: 1s ease;">
        <h1>Welcome to Our Car Store</h1>
        <p>Your one-stop shop for all car needs</p>
        <button onclick="location.href='#catalog'">Browse Catalog</button>
    </div>
</div>

<section id="catalog">
    <div class="section-header">
        <h1>Our Cars</h1>
        <p>Explore our wide range of premium vehicles.</p>
    </div>
    
    <div class="catalog-grid">
        <!-- Car Card Template -->
        <div class="car-card">
            <img src="imeages/bmw2.png" alt="BMW XR3">
            <h4>BMW XR3</h4>
            <p>Price: $20,000</p>
            <button class="view-btn">View Details</button>
        </div>
        <!-- Repeat for other cars -->
    </div>
</section>

<!-- ... Other sections (About, Reviews) remain the same but cleaner ... -->

<footer id="footer">
    <p class="copyright">© 2026 Car Store. All rights reserved.</p>
</footer>

</body>
</html>
